services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: truelode
      POSTGRES_PASSWORD: truelode
      POSTGRES_DB: truelode
    ports: ["5432:5432"]
    volumes: ["dbdata:/var/lib/postgresql/data"]

  backend:
    build: ../backend
    environment:
      DATABASE_URL: postgresql+psycopg2://truelode:truelode@db:5432/truelode
      JWT_SECRET_KEY: change-me-in-prod-32-bytes-minimum-secret
      SECRET_KEY: change-me-in-prod
    depends_on: [db]
    ports: ["5000:5000"]

  web:
    build: ../web
    environment:
      NEXT_PUBLIC_API_BASE: http://localhost:5000
      NEXT_PUBLIC_SOCKET_URL: http://localhost:5000
    depends_on: [backend]
    ports: ["3000:3000"]

volumes:
  dbdata:
